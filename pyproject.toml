[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-rt"
version = "0.1.0"
description = "GENESIS RT — from human intent to tested QNX-native machine software"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
keywords = ["qnx", "rtos", "codegen", "robotics", "verification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
yaml = ["pyyaml>=6"]
dev = ["pytest>=7", "pyyaml>=6", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "jsonschema>=4"]

[project.scripts]
genesis-rt = "genesis_rt.cli:main"

[tool.setuptools.packages.find]
where = ["host"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
