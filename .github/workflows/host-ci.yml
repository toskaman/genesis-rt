name: host-ci

on:
  push:
    branches: ["**"]
  pull_request:

# Wave 12 §7: one run per ref; a newer push cancels the older one.
concurrency:
  group: host-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the IR check diffs against the push base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install -r requirements.lock
      - name: Lint (ruff bug classes)
        run: |
          pip install "ruff==0.17.4"
          python -m ruff check host/ tests/ bench/ scripts/ --select F401,F841,F541,B017
      - name: Install Chromium for browser E2E
        run: python -m playwright install --with-deps chromium
      - name: Install axe-core for the automated WCAG 2.2 scan
        run: npm install --no-save axe-core@4.10.2
      - name: Host C policy check
        run: |
          cc -O1 -Wall -Wextra -Itarget/qnx8/include -Itarget/qnx8/common \
            -o /tmp/guard_vector target/qnx8/common/guard_policy.c target/qnx8/host_tests/guard_vector.c
          printf 'LIMITS 1.2 1.0 100\n47454E31 1 1 1 0 50 0.5 0.0 1 0 1 0 1\n' | /tmp/guard_vector
      - name: Unit + integration + fault + acceptance tests
        run: python -m pytest tests/ -q
      - name: GENESIS IR check (changed files)
        run: |
          # Wave 12 §7: PRs use the genuine PR base; pushes use the
          # push base (github.event.before is empty on PR events, and
          # the all-zero SHA of a first push falls back to all IRs).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          GENESIS_CI_BASE="$BASE" PYTHONPATH=host \
            python scripts/ci_ir_check.py --out ir-ci-report.json \
              --plan-out proofos-plan.json
      - name: Upload ProofOS plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proofos-plan
          path: proofos-plan.json
      - name: Upload IR check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ir-ci-report
          path: ir-ci-report.json
      - name: Verified demo pipeline
        run: |
          PYTHONPATH=host python scripts/run_verified_demo.py
          PYTHONPATH=host python scripts/replay.py artifacts/runs/*/passport.json
